name: Publish release assets
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make pdf
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: output/*.pdf
