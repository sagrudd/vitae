services:
  latex:
    build:
      context: .
    working_dir: /work
    volumes:
      - ./output:/artifacts
      - ./publications:/work/publications
      - ./content:/work/content
      - ./dashboard:/work/dashboard
      - ./site:/work/site
    environment:
      HOME: /tmp
      TEXMFVAR: /tmp/texmf-var
      SOURCE_DATE_EPOCH: "1785888000"
